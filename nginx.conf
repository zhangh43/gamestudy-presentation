server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Keep directory redirects on the public host and port used by the browser.
    absolute_redirect off;

    location = / {
        return 302 /lesson1/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
