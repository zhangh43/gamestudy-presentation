<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星球地鼠突击队</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#243b6b,#0b1020 65%);color:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;user-select:none}.game{width:min(920px,94vw);padding:28px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px}.top h1{margin:0;font-size:clamp(28px,5vw,54px)}.stats{display:flex;gap:12px}.pill{background:#ffffff16;border:1px solid #ffffff2b;border-radius:16px;padding:10px 16px;min-width:100px;text-align:center}.pill b{display:block;font-size:30px;color:#ffd166}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:28px 0}.hole{aspect-ratio:1;border:0;border-radius:28px;background:linear-gradient(#080d19,#172037);position:relative;overflow:hidden;cursor:pointer;box-shadow:inset 0 -8px 0 #ffffff0b,0 10px 30px #0004}.hole:after{content:"";position:absolute;left:12%;right:12%;bottom:7%;height:20%;border-radius:50%;background:#02040a99}.mole{position:absolute;inset:12%;display:grid;place-items:center;border-radius:50% 50% 45% 45%;font-size:clamp(40px,7vw,78px);transform:translateY(130%);transition:.13s cubic-bezier(.2,.8,.2,1);background:linear-gradient(145deg,#ffd166,#ff8e4f);box-shadow:0 8px 0 #a95134}.up .mole{transform:translateY(0)}.bad .mole{background:linear-gradient(145deg,#ff6b6b,#b42d61);box-shadow:0 8px 0 #681840}.hit .mole{transform:scale(.82);filter:brightness(1.5)}.controls{display:flex;justify-content:center;gap:12px}.controls button{border:0;border-radius:16px;padding:14px 24px;font-weight:900;font-size:18px;cursor:pointer}.start{background:#53d8d2;color:#10243b}.reset{background:#ffffff18;color:#fff}.tip{text-align:center;color:#aebdd9}.toast{height:28px;text-align:center;font-size:20px;font-weight:900;color:#ffd166}@media(max-width:650px){.board{grid-template-columns:repeat(3,1fr);gap:10px}.game{padding:16px}.top{align-items:start}.stats{gap:6px}.pill{min-width:76px;padding:8px}.pill b{font-size:24px}}
</style></head><body><main class="game"><header class="top"><div><div style="color:#53d8d2;font-weight:900">AI GAME LAB · DEMO</div><h1>🪐 星球地鼠突击队</h1></div><div class="stats"><div class="pill">得分<b id="score">0</b></div><div class="pill">时间<b id="time">30</b></div></div></header><div class="toast" id="toast"></div><section class="board" id="board"></section><div class="controls"><button class="start" id="start">开始挑战</button><button class="reset" id="reset">重新开始</button></div><p class="tip">点击 👽 +1 分；避开 💣，点中会 −2 分。速度会越来越快！</p></main><script>
const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),toast=document.querySelector('#toast');let score=0,time=30,running=false,last=-1,spawnTimer,countTimer;for(let i=0;i<12;i++){const h=document.createElement('button');h.className='hole';h.innerHTML='<span class="mole">👽</span>';h.onclick=()=>hit(h);board.append(h)}const holes=[...document.querySelectorAll('.hole')];function pop(){holes.forEach(h=>h.className='hole');if(!running)return;let i;do{i=Math.floor(Math.random()*holes.length)}while(i===last);last=i;const bad=Math.random()<.18,h=holes[i];h.classList.add('up');if(bad){h.classList.add('bad');h.querySelector('.mole').textContent='💣'}else h.querySelector('.mole').textContent='👽';const speed=Math.max(330,780-(30-time)*14);spawnTimer=setTimeout(pop,speed)}function hit(h){if(!running||!h.classList.contains('up')||h.classList.contains('hit'))return;const bad=h.classList.contains('bad');score+=bad?-2:1;score=Math.max(0,score);scoreEl.textContent=score;toast.textContent=bad?'💥 糟糕，−2！':'⚡ 命中，+1！';h.classList.add('hit');setTimeout(()=>toast.textContent='',350)}function begin(){clearTimeout(spawnTimer);clearInterval(countTimer);score=0;time=30;running=true;scoreEl.textContent=0;timeEl.textContent=30;start.textContent='进行中…';start.disabled=true;pop();countTimer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end()},1000)}function end(){running=false;clearTimeout(spawnTimer);clearInterval(countTimer);holes.forEach(h=>h.className='hole');toast.textContent=`挑战结束！你得到 ${score} 分`;start.textContent='再玩一次';start.disabled=false}start.onclick=begin;reset.onclick=begin;
</script></body></html>
